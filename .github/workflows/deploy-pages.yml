name: Deploy Prompt Generator PWA to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Materialize V1.1 dictionary source
        run: |
          if [ -f scripts/upgrade-dictionary-v1_1.py ]; then
            python scripts/upgrade-dictionary-v1_1.py
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html service-worker.js
            if ! git diff --cached --quiet; then
              git commit -m "Materialize PWA V1.1 dictionary"
              git push origin main
            fi
          fi

      - name: Verify published source
        run: |
          test -f index.html
          test -f manifest.webmanifest
          test -f service-worker.js
          test -f icon-192.png
          test -f icon-512.png
          test -f apple-touch-icon.png
          grep -q 'V1.1.0 Dictionary' index.html
          grep -q '成人玩法辭典' index.html
          grep -q 'play-dict-body' index.html
          grep -q 'orgasm_control' index.html
          grep -q 'roleplay_scenario' index.html
          grep -q 'trait-preset-chip' index.html
          ! grep -q '<datalist id="trait-' index.html
          grep -q 'adult-prompt-generator-pwa-v1-1-0' service-worker.js

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

name: Deploy Prompt Generator PWA to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout webroot
        uses: actions/checkout@v4

      - name: Verify published source
        run: |
          test -f index.html
          test -f manifest.webmanifest
          test -f service-worker.js
          test -f icon-192.png
          test -f icon-512.png
          test -f apple-touch-icon.png
          grep -q 'V1.0.3 PWA' index.html
          grep -q 'trait-preset-chip' index.html
          grep -q 'relationshipTypeChips' index.html
          ! grep -q '<datalist id="trait-' index.html
          grep -q 'adult-prompt-generator-pwa-v1-0-3' service-worker.js

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

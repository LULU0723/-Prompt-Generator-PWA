name: Deploy Prompt Generator PWA to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout webroot
        uses: actions/checkout@v4

      - name: Verify V1.2.2 quick prompt source
        run: |
          test -f index.html
          test -f manifest.webmanifest
          test -f service-worker.js
          test -f icon-192.png
          test -f icon-512.png
          test -f apple-touch-icon.png
          grep -q 'V1.2.2 Quick Prompt Hotfix' index.html
          grep -q "let generatorMode = 'full';" index.html
          grep -q '玩法速貼' index.html
          grep -q 'compileQuickPrompt' index.html
          grep -q 'validateQuickInput' index.html
          grep -q 'quickCopyPrompt' index.html
          grep -q 'adult-prompt-generator-pwa-v1-2-2' service-worker.js
          ! grep -q '<datalist id="trait-' index.html
          python - <<'PY'
          from pathlib import Path
          import re
          text = Path('index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script>(.*?)</script>', text, re.S)
          assert len(scripts) == 1, f'expected one executable inline script, got {len(scripts)}'
          js = scripts[0]
          assert js.index("let generatorMode = 'full';") < js.index('function uiValidation()')
          assert "$('#generatorModeSwitcher').onclick" in js
          Path('/tmp/prompt-generator-app.js').write_text(js, encoding='utf-8')
          PY
          node --check /tmp/prompt-generator-app.js
          node --check service-worker.js

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

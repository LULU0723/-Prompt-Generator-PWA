name: Deploy Prompt Generator PWA to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout webroot
        uses: actions/checkout@v4

      - name: Verify V1.2 composer source
        run: |
          test -f index.html
          test -f manifest.webmanifest
          test -f service-worker.js
          test -f icon-192.png
          test -f icon-512.png
          test -f apple-touch-icon.png
          grep -q 'V1.2.0 Composer' index.html
          grep -q '核心元素組合器' index.html
          grep -q "label:'炮機'" index.html
          grep -q "label:'八爪椅'" index.html
          grep -q "label:'觸手'" index.html
          grep -q "label:'注入'" index.html
          grep -q "label:'完全無法動彈'" index.html
          grep -q '核心成人元素與功能：' index.html
          grep -q 'readElementCombos' index.html
          grep -q 'adult-prompt-generator-pwa-v1-2-0' service-worker.js
          ! grep -q '<datalist id="trait-' index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

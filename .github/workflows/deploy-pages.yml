name: Materialize and deploy Prompt Generator PWA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Rebuild frozen PWA webroot
        run: |
          cat \
            bundle/site.b64.00 \
            bundle/site.b64.01a \
            bundle/site.b64.01b \
            bundle/site.b64.02 \
            bundle/site.b64.03 \
            bundle/site.b64.04 \
            bundle/site.b64.05a \
            bundle/site.b64.05b \
            bundle/site.b64.06 \
            bundle/site.b64.07 \
            | base64 --decode > site-rebuilt.zip
          unzip -tq site-rebuilt.zip
          rm -rf dist
          mkdir -p dist
          unzip -q site-rebuilt.zip -d dist

      - name: Apply V1.0.3 mobile vocabulary chip UI
        run: |
          python scripts/patch-mobile-chips.py
          grep -q 'V1.0.3 PWA' dist/index.html
          grep -q 'trait-preset-chip' dist/index.html
          grep -q 'relationshipTypeChips' dist/index.html
          ! grep -q '<datalist id="trait-' dist/index.html
          grep -q 'adult-prompt-generator-pwa-v1-0-3' dist/service-worker.js

      - name: Materialize published webroot into main
        run: |
          cp dist/index.html ./index.html
          cp dist/manifest.webmanifest ./manifest.webmanifest
          cp dist/service-worker.js ./service-worker.js
          cp dist/icon-192.png ./icon-192.png
          cp dist/icon-512.png ./icon-512.png
          cp dist/apple-touch-icon.png ./apple-touch-icon.png
          touch .nojekyll

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html manifest.webmanifest service-worker.js icon-192.png icon-512.png apple-touch-icon.png .nojekyll
          if ! git diff --cached --quiet; then
            git commit -m "Materialize PWA V1.0.3 webroot"
            git push origin main
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
